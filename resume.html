<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manav Chawla - Resume</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.4;
            color: #2c3e50;
            background: #f5f5f5;
            padding: 20px;
        }

        .resume {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        .header {
            background: #ffffff;
            color: #1a1a1a;
            padding: 18px 35px 12px;
            border-bottom: 2px solid #2c3e50;
        }

        .name {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
            color: #1a1a1a;
            text-transform: uppercase;
        }

        .title {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 12px;
            color: #5a6c7d;
            letter-spacing: 0.3px;
        }

        .contact {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #5a6c7d;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .contact-item:before {
            content: "•";
            color: #2c3e50;
            font-weight: bold;
        }

        .contact a {
            color: #2c3e50;
            text-decoration: none;
            transition: color 0.2s;
        }

        .contact a:hover {
            color: #1a1a1a;
            text-decoration: underline;
        }

        .content {
            padding: 16px 35px 20px;
        }

        .summary {
            margin-bottom: 22px;
            line-height: 1.5;
            color: #2c3e50;
            font-size: 13px;
            text-align: justify;
            padding: 10px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            position: relative;
            padding-bottom: 5px;
        }

        .section-title:after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 35px;
            height: 2px;
            background: #2c3e50;
        }

        .skills-list {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
            font-size: 13px;
        }

        .skills-list li {
            position: relative;
            padding-left: 14px;
            color: #2c3e50;
            font-weight: 500;
        }

        .skills-list li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .skill-item {
            margin-bottom: 8px;
            font-size: 13px;
            color: #2c3e50;
            line-height: 1.6;
        }

        .skill-item strong {
            font-weight: 600;
            color: #1a1a1a;
            margin-right: 6px;
        }

        .education-degree {
            font-size: 14.5px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 3px;
        }

        .education-institution {
            font-size: 13px;
            color: #5a6c7d;
            margin-bottom: 2px;
            line-height: 1.4;
        }

        .education-gpa {
            font-size: 12px;
            color: #7a8c9e;
            margin-top: 2px;
        }

        .education-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .education-dates {
            font-size: 12px;
            color: #7a8c9e;
            white-space: nowrap;
        }

        .project-header {
            margin-bottom: 6px;
        }

        .project-header strong {
            font-size: 14.5px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .project-item p {
            font-size: 12px;
            color: #2c3e50;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .project-features {
            list-style: none;
            padding-left: 0;
            margin-bottom: 6px;
        }

        .project-features li {
            padding-left: 15px;
            position: relative;
            margin-bottom: 3px;
            font-size: 12px;
            color: #2c3e50;
            line-height: 1.5;
        }

        .project-features li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .project-tags {
            font-size: 12px;
            color: #7a8c9e;
            margin-top: 6px;
        }

        .project-tags strong {
            font-weight: 600;
            color: #5a6c7d;
        }

        .tech-stack {
            font-size: 12px;
            color: #7a8c9e;
            margin-top: 6px;
            line-height: 1.4;
        }

        .tech-stack strong {
            font-weight: 600;
            color: #5a6c7d;
        }

        .job-title-container {
            flex: 1;
        }

        .job-dates {
            font-size: 11.5px;
            color: #7a8c9e;
            white-space: nowrap;
        }

        .experience-item {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8e8e8;
        }

        .experience-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .job-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.2px;
        }

        .job-date {
            font-size: 11.5px;
            color: #5a6c7d;
            font-weight: 400;
            white-space: nowrap;
        }

        .company {
            font-size: 13px;
            color: #5a6c7d;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .responsibilities {
            list-style: none;
            padding-left: 0;
        }

        .responsibilities li {
            padding-left: 15px;
            position: relative;
            margin-bottom: 4px;
            font-size: 13px;
            color: #2c3e50;
            line-height: 1.5;
            text-align: justify;
        }

        .responsibilities li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .education-item, .project-item {
            margin-bottom: 11px;
            padding-bottom: 9px;
            border-bottom: 1px solid #e8e8e8;
        }

        .education-item:last-child, .project-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .degree, .project-name {
            font-size: 14.5px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 3px;
        }

        .school {
            font-size: 13px;
            color: #5a6c7d;
            margin-bottom: 2px;
            line-height: 1.4;
        }

        .education-detail {
            font-size: 12px;
            color: #7a8c9e;
            margin-top: 2px;
        }

        .project-description {
            list-style: none;
            padding-left: 0;
        }

        .project-description li {
            padding-left: 15px;
            position: relative;
            margin-bottom: 3px;
            font-size: 12px;
            color: #2c3e50;
            line-height: 1.5;
        }

        .project-description li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .controls {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: #1a1a1a;
        }

        .btn-download:hover {
            box-shadow: 0 4px 12px rgba(26, 26, 26, 0.3);
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .resume {
                box-shadow: none;
                max-width: 100%;
                margin: 0;
            }

            .controls {
                display: none !important;
            }

            .header {
                background: #ffffff !important;
                border-bottom: 2px solid #2c3e50 !important;
                padding: 16px 35px 12px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .content {
                padding: 14px 35px 16px !important;
            }

            .section {
                margin-bottom: 18px !important;
            }

            .section:last-child {
                margin-bottom: 0 !important;
            }

            .section-title {
                margin-bottom: 8px !important;
                padding-bottom: 4px !important;
                page-break-after: avoid !important;
            }

            .section-title:after {
                background: #2c3e50 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .summary {
                border-bottom: 1px solid #e8e8e8 !important;
                margin-bottom: 18px !important;
                padding: 9px 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .education-item, .project-item {
                margin-bottom: 10px !important;
                padding-bottom: 8px !important;
                border-bottom: 1px solid #e8e8e8 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .experience-item {
                margin-bottom: 11px !important;
                padding-bottom: 9px !important;
                border-bottom: 1px solid #e8e8e8 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .job-header, .job-title, .company {
                page-break-after: avoid !important;
            }

            .responsibilities li, .project-description li {
                page-break-inside: avoid !important;
                page-break-before: auto !important;
            }

            .responsibilities li {
                margin-bottom: 4px !important;
            }

            .project-description li {
                margin-bottom: 3px !important;
            }

            .responsibilities li:before,
            .skills-list li:before,
            .project-description li:before {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        @page {
            margin: 0.3in 0.4in 0.48in 0.4in;
            size: letter;
        }

        .tech-stack {
            font-size: 11.5px;
            color: #7a8c9e;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="window.print()">🖨️ Print</button>
        <button class="btn btn-download" id="downloadBtn" onclick="downloadPDF()">📄 Download PDF</button>
    </div>

    <div class="resume">
        <div class="header">
            <h1 class="name" id="name">Loading...</h1>
            <div class="title" id="title">Loading...</div>
            <div class="contact">
                <div class="contact-item" id="phone">Loading...</div>
                <div class="contact-item" id="email">Loading...</div>
                <div class="contact-item" id="location">Loading...</div>
                <div class="contact-item"><a href="#" id="linkedin-link">LinkedIn</a></div>
                <div class="contact-item"><a href="#" id="github-link">GitHub</a></div>
            </div>
        </div>

        <div class="content">
            <div class="summary" id="summary">
                Loading...
            </div>

            <div class="section">
                <h2 class="section-title">Skills</h2>
                <div id="skills-list"></div>
            </div>

            <div class="section experience-section">
                <h2 class="section-title">Professional Experience</h2>
                <div id="experience-list"></div>
            </div>

            <div class="section">
                <h2 class="section-title">Projects</h2>
                <div id="projects-list"></div>
            </div>

            <div class="section">
                <h2 class="section-title">Education</h2>
                <div id="education-list"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/resume.js"></script>
    <script>
        async function downloadPDF() {
            const button = document.getElementById('downloadBtn');
            const originalText = button.innerHTML;

            try {
                // Disable button and show loading state
                button.disabled = true;
                button.innerHTML = '⏳ Generating PDF...';

                // Get the resume element
                const element = document.querySelector('.resume');

                // Clone the element to modify it without affecting the display
                const clone = element.cloneNode(true);

                // Configure PDF options
                const opt = {
                    margin: [0.3, 0.4, 0.48, 0.4], // top, right, bottom, left in inches
                    filename: 'Manav_Chawla_Resume.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        letterRendering: true,
                        scrollY: 0,
                        scrollX: 0,
                        windowHeight: element.scrollHeight + 100
                    },
                    jsPDF: {
                        unit: 'in',
                        format: 'letter',
                        orientation: 'portrait',
                        compress: true
                    },
                    pagebreak: {
                        mode: ['css', 'legacy'],
                        avoid: ['.section-title', '.job-header', '.job-title']
                    }
                };

                // Generate PDF
                await html2pdf().set(opt).from(clone).save();

                // Success message
                button.innerHTML = '✓ Downloaded!';
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }, 2000);

            } catch (error) {
                console.error('Error generating PDF:', error);
                button.innerHTML = '✗ Error';
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }, 2000);
            }
        }
    </script>
</body>
</html>
